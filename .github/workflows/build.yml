name: Build FlightBlock

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - id: targets
        run: echo "targets=$(jq -c . ci/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    name: ${{ matrix.target.minecraft }} / ${{ matrix.target.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            **/gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Build selected version and loader
        env:
          PROJECT: ${{ matrix.target.project }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --project-dir "$PROJECT" clean build
      - name: Stage installable JARs
        env:
          PROJECT: ${{ matrix.target.project }}
          MC: ${{ matrix.target.minecraft }}
          LOADER: ${{ matrix.target.loader }}
        run: |
          mkdir -p "dist/$MC"
          find "$PROJECT/build/libs" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} "dist/$MC/" \;
          test -n "$(find "dist/$MC" -name "*-$LOADER-*.jar" -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.target.minecraft }}-${{ matrix.target.loader }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: release/
          merge-multiple: true
      - name: Package all versions together
        working-directory: release
        run: |
          find . -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          zip -r "../FlightBlock-all-versions-${{ github.run_number }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: FlightBlock-all-versions-${{ github.run_number }}
          path: FlightBlock-all-versions-*.zip
          if-no-files-found: error
          retention-days: 30
