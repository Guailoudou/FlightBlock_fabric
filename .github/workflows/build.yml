name: Build FlightBlock

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flightblock-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - run: python ci/test_java8_sources.py
      - id: targets
        run: echo "targets=$(jq -c . ci/targets.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.matrix.outputs.targets) }}
    name: ${{ matrix.target.minecraft }} / ${{ matrix.target.loader }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.target.java }}
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            **/gradle.properties
            gradle/wrapper/gradle-wrapper.properties
      - name: Build selected version and loader
        env:
          PROJECT: ${{ matrix.target.project }}
          TARGET: ${{ toJson(matrix.target) }}
        run: |
          chmod +x gradlew
          mapfile -t properties < <(jq -r '.properties // {} | to_entries[] | "-P\(.key)=\(.value)"' <<< "$TARGET")
          ./gradlew --no-daemon --project-dir "$PROJECT" "${properties[@]}" clean build
      - name: Stage installable JARs
        env:
          PROJECT: ${{ matrix.target.project }}
          MC: ${{ matrix.target.minecraft }}
          LOADER: ${{ matrix.target.loader }}
        run: |
          mkdir -p "dist/$MC"
          find "$PROJECT/build/libs" -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-slim.jar' -exec cp {} "dist/$MC/" \;
          test -n "$(find "dist/$MC" -name "*-$LOADER-*.jar" -print -quit)"
          python ci/verify_artifact.py "dist/$MC" "$MC" "$LOADER"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.target.minecraft }}-${{ matrix.target.loader }}
          path: dist/
          if-no-files-found: error
          retention-days: 3

  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: release/
          merge-multiple: true
      - name: Generate consolidated checksums
        working-directory: release
        run: |
          find . -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: FlightBlock-all-versions-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary per-target artifacts
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
            });
            for (const artifact of artifacts.filter(a => a.name.startsWith('part-'))) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id
              });
            }
