// Compile mapped variants of the shared gameplay sources.
def legacyNbt = flightblockMinecraftVersion in ['1.20.4', '1.20.2', '1.20.1', '1.19.4']
def legacyRecipes = flightblockMinecraftVersion in ['1.20.2', '1.20.1', '1.19.4']
def generatedSources = layout.buildDirectory.dir('version-sources')
def prepareSources = tasks.register('prepareVersionSources', Sync) {
    from(new File(flightblockSourceRoot, 'src/main/java')) {
        if (legacyNbt) exclude 'dev/flightblock/FlightItems.java'
        if (legacyRecipes) exclude 'dev/flightblock/mixin/ExplosionMixin.java'
    }
    if (legacyRecipes) from new File(flightblockSourceRoot, 'ports/legacy/recipes/src/main/java')
    if (legacyNbt) from new File(flightblockSourceRoot, 'ports/legacy/nbt/src/main/java')
    from file('src/main/java')
    if (flightblockMinecraftVersion in ['1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4']) {
        from(new File(flightblockSourceRoot, 'ports/legacy/common/src/main/java')) {
            if (!(flightblockMinecraftVersion in ['1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4'])) include '**/LegacyJson.java'
        }
    }
    into generatedSources
    filteringCharset = 'UTF-8'
    filter { String line ->
        def adapted = line.replace('Recipe.DIRECT_CODEC', 'Recipe.CODEC')
            .replace('ServerEntityLevelChangeEvents', 'ServerEntityWorldChangeEvents')
            .replace('AFTER_PLAYER_CHANGE_LEVEL', 'AFTER_PLAYER_CHANGE_WORLD')
            .replace('public abstract class ShapedRecipeMixin {', 'public abstract class ShapedRecipeMixin implements CraftingRecipe {')
            .replace('p.drop(stack, false, net.minecraft.util.Prediction.PREDICTED)', 'p.drop(stack, false)')
            .replace('EntityTypes.BLOCK_DISPLAY', 'EntityType.BLOCK_DISPLAY')
            .replace('ContainerInput', 'ClickType')
            .replace('ItemInstance', 'ItemStack')
            .replace('ItemStackTemplate', 'ItemStack')
            .replace('result.components().get(DataComponentMap.EMPTY, DataComponents.CUSTOM_DATA)', 'result.get(DataComponents.CUSTOM_DATA)')
            .replace('Identifier.fromNamespaceAndPath("flightblock", "anchors"), WorldState::new', '"flightblock_anchors", WorldState::new')
            .replace('chunk.getPos().x()', 'chunk.getPos().x')
            .replace('chunk.getPos().z()', 'chunk.getPos().z')
            .replace('(level, chunk, generated) -> mod.chunkLoaded(level, chunk)', '(level, chunk) -> mod.chunkLoaded(level, chunk)')
            .replace('void flightblock$mine(ServerLevel level, ServerPlayer player,', 'void flightblock$mine(net.minecraft.world.level.Level level, net.minecraft.world.entity.player.Player player,')
            .replace('crafting/CraftingInput;)Lnet/minecraft/world/item/ItemStack;', 'crafting/CraftingInput;Lnet/minecraft/core/HolderLookup$Provider;)Lnet/minecraft/world/item/ItemStack;')
            .replace('flightblock$assemble(CraftingInput input, CallbackInfoReturnable', 'flightblock$assemble(CraftingInput input, net.minecraft.core.HolderLookup.Provider registries, CallbackInfoReturnable')
            .replace('recipe.assemble(input)', 'recipe.assemble(input, FlightBlock.INSTANCE.server.registryAccess())')
            .replace('recipe.assemble(CraftingInput.of(3, 3, invalid))', 'recipe.assemble(CraftingInput.of(3, 3, invalid), FlightBlock.INSTANCE.server.registryAccess())')
        if (flightblockMinecraftVersion in ['1.21.8', '1.21.4', '1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4']) {
            adapted = adapted.replace('Identifier', 'ResourceLocation').replace('.identifier()', '.location()')
        }
        if (flightblockMinecraftVersion == '1.21.8') adapted = adapted.replace('mod.tick(event.server())', 'mod.tick(event.getServer())')
        if (flightblockMinecraftVersion in ['1.21.4', '1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4']) {
            adapted = adapted.replace('import net.minecraft.world.level.storage.TagValueInput;', '')
                .replace('Commands.hasPermission(Commands.LEVEL_GAMEMASTERS)', 'source -> source.hasPermission(2)')
                .replace('readAdditionalSaveData(TagValueInput.create(ProblemReporter.DISCARDING, level.registryAccess(), data))', 'readAdditionalSaveData(data)')
                .replace('copyTag().getCompound("flightblock").orElseThrow()', 'copyTag().getCompound("flightblock")')
                .replace('getIntOr("schemaVersion", -1)', 'getInt("schemaVersion")')
                .replace('getIntOr("level", -1)', 'getInt("level")')
                .replace('getIntOr("flightblock_recipe", 0)', 'getInt("flightblock_recipe")')
                .replace('getString("instanceId").orElseThrow()', 'getString("instanceId")')
                .replace('getLong("activatedAt").orElseThrow()', 'getLong("activatedAt")')
                .replace('getLong("expiresAt").orElseThrow()', 'getLong("expiresAt")')
                .replace('p.level()', 'p.serverLevel()')
                .replace('BlockPos pos, BlockState next, int flags', 'BlockPos pos, BlockState next, boolean flags')
                .replace('computeIfAbsent(WorldState.TYPE)', 'computeIfAbsent(WorldState.TYPE, "flightblock_anchors")')
            if (adapted.contains('public static final SavedDataType<WorldState> TYPE')) {
                adapted = '    public static final SavedData.Factory<WorldState> TYPE = new SavedData.Factory<>(WorldState::new, (tag, registries) -> CODEC.parse(net.minecraft.nbt.NbtOps.INSTANCE, tag).getOrThrow(), null);'
            }
            if (adapted.contains('public final Map<String, Anchor> byId')) {
                adapted = '    @Override public net.minecraft.nbt.CompoundTag save(net.minecraft.nbt.CompoundTag tag, net.minecraft.core.HolderLookup.Provider registries) { return (net.minecraft.nbt.CompoundTag)CODEC.encodeStart(net.minecraft.nbt.NbtOps.INSTANCE, this).getOrThrow(); }\n' + adapted
            }
        }
        if (flightblockMinecraftVersion in ['1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4']) {
            adapted = adapted.replace('menu.getResultSlot()', 'menu.getSlot(menu.getResultSlotIndex())')
                .replace('AbstractContainerMenu menu, ServerLevel level, Player player', 'AbstractContainerMenu menu, net.minecraft.world.level.Level level, Player player')
                .replace('flightblock$explode(BlockState state, ServerLevel level', 'flightblock$explode(BlockState state, net.minecraft.world.level.Level level')
                .replace('new DustParticleOptions(color, .8f)', 'new DustParticleOptions(new org.joml.Vector3f((color >> 16 & 255) / 255f, (color >> 8 & 255) / 255f, (color & 255) / 255f), .8f)')
        }
        if (flightblockMinecraftVersion in ['1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4']) {
            adapted = adapted.replace('import com.google.gson.Strictness;', '')
                .replace('reader.setStrictness(Strictness.STRICT);', 'reader.setLenient(false); LegacyJson.validate(json);')
                .replace('JsonElement root = JsonParser.parseReader(reader)', 'JsonElement root = com.google.gson.internal.Streams.parse(reader)')
        }
        if (flightblockMinecraftVersion in ['1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4']) {
            adapted = adapted.replace('import net.minecraft.world.item.crafting.CraftingInput;', 'import net.minecraft.world.inventory.CraftingContainer;')
                .replace('net.minecraft.resources.ResourceLocation.parse(', 'new net.minecraft.resources.ResourceLocation(')
                .replace('ResourceLocation.parse(', 'new ResourceLocation(')
                .replace('import net.minecraft.world.item.crafting.*;', 'import net.minecraft.world.item.crafting.*;\nimport net.minecraft.world.inventory.CraftingContainer;')
                .replace('CraftingInput.of(', 'LegacyCrafting.input(')
                .replace('CraftingInput', 'CraftingContainer')
                .replace('crafting/CraftingContainer', 'inventory/CraftingContainer')
                .replace('world/item/inventory/CraftingContainer', 'world/inventory/CraftingContainer')
                .replace('input.width()', 'input.getWidth()').replace('input.height()', 'input.getHeight()')
                .replace('craftSlots.asCraftInput()', 'craftSlots')
                .replace('RecipeHolder<CraftingRecipe> hint, ', '')
                .replace('original.call(menu, level, player, input, result, hint)', 'original.call(menu, level, player, input, result)')
                .replace('/data/flightblock/recipe/', '/data/flightblock/recipes/')
        }
        if (legacyNbt) {
            adapted = adapted.replace('import net.minecraft.core.component.DataComponents;', '')
                .replace('import net.minecraft.core.component.DataComponentMap;', '')
                .replace('import net.minecraft.world.item.component.CustomData;', '')
                .replace('import net.minecraft.util.ProblemReporter;', '')
                .replace('level(ItemStack result)', 'level(String group)')
                .replace('CustomData data = result.get(DataComponents.CUSTOM_DATA);', 'return group.matches("flightblock:level_[123]") ? group.charAt(group.length() - 1) - \'0\' : 0;')
                .replace('return data == null ? 0 : data.copyTag().getInt("flightblock_recipe");', '')
                .replace('@Shadow @Final private ItemStack result;', '@Shadow @Final private String group;')
                .replace('FlightRecipes.level(result)', 'FlightRecipes.level(group)')
                .replace('net.minecraft.core.HolderLookup.Provider registries', 'net.minecraft.core.RegistryAccess registries')
                .replace('net/minecraft/core/HolderLookup$Provider', 'net/minecraft/core/RegistryAccess')
                .replace('(tag, registries) -> CODEC.parse', 'tag -> CODEC.parse')
                .replace('save(net.minecraft.nbt.CompoundTag tag, net.minecraft.core.RegistryAccess registries)', 'save(net.minecraft.nbt.CompoundTag tag)')
                .replace('item.get(DataComponents.ENCHANTMENT_GLINT_OVERRIDE)', 'item.hasFoil()')
                .replace('ItemStack.isSameItemSameComponents', 'ItemStack.isSameItemSameTags')
                .replace('renamed.set(DataComponents.CUSTOM_NAME, ', 'renamed.setHoverName(')
                .replace('renamed.set(DataComponents.ENCHANTMENT_GLINT_OVERRIDE, true)', 'FlightItems.glint(renamed)')
                .replace('renamed.set(DataComponents.CUSTOM_DATA, CustomData.of(root))', 'renamed.setTag(root)')
                .replace('import net.neoforged.neoforge.event.tick.ServerTickEvent;', 'import net.neoforged.neoforge.event.TickEvent;')
                .replace('(ServerTickEvent.Post event) -> mod.tick(event.getServer())', '(TickEvent.ServerTickEvent event) -> { if (event.phase == TickEvent.Phase.END) mod.tick(mod.server); }')
                .replace('(TickEvent.ServerTickEvent.Post event) -> mod.tick(event.getServer())', '(TickEvent.ServerTickEvent event) -> { if (event.phase == TickEvent.Phase.END) mod.tick(mod.server); }')
                .replace('.getOrThrow()', '.getOrThrow(false, error -> { throw new IllegalArgumentException(error); })')
        }
        if (legacyRecipes) adapted = adapted.replace('Recipe.CODEC.parse(', 'LegacyRecipes.parse(')
        if (flightblockMinecraftVersion in ['1.20.1', '1.19.4']) {
            if (adapted.contains('public static final SavedData.Factory<WorldState> TYPE')) adapted = ''
            adapted = adapted.replace('computeIfAbsent(WorldState.TYPE, "flightblock_anchors")', 'computeIfAbsent(tag -> WorldState.CODEC.parse(net.minecraft.nbt.NbtOps.INSTANCE, tag).getOrThrow(false, error -> { throw new IllegalArgumentException(error); }), WorldState::new, "flightblock_anchors")')
        }
        if (flightblockMinecraftVersion == '1.19.4') adapted = adapted.replace('p.serverLevel()', 'p.getLevel()').replace('LootParams', 'LootContext')
        // These Forge/NeoForge distributions install Minecraft in official names.
        // Fabric/Quilt still require named -> intermediary remapping.
        if (project.hasProperty('flightblockOfficialRuntime') && flightblockOfficialRuntime) {
            adapted = adapted.replaceAll('@Mixin\\(([^)]+)\\)', '@Mixin(value = $1, remap = false)')
        }
        adapted
    }
}
sourceSets.main.java.setSrcDirs([generatedSources])
tasks.named('compileJava') { dependsOn prepareSources }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn prepareSources }
if (flightblockMinecraftVersion in ['1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4']) {
    tasks.named('processResources') {
        filesMatching('data/flightblock/recipe/*.json') {
            filter { String line -> line.contains('"key":') ? line.replaceAll('"([A-Z])": "([^"]+)"', '"$1": {"item": "$2"}') : line }
            if (legacyNbt) filter { String line ->
                if (!line.contains('"result":')) return line
                def marker = line =~ /"flightblock_recipe":\s*([123])/
                if (!marker.find()) throw new GradleException('Missing flight recipe tier')
                '  "group": "flightblock:level_' + marker.group(1) + '", "result": {"item": "minecraft:target", "count": 1}'
            }
        }
        if (flightblockMinecraftVersion in ['1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4']) {
            eachFile { if (it.path.startsWith('data/flightblock/recipe/')) it.path = it.path.replace('data/flightblock/recipe/', 'data/flightblock/recipes/') }
        }
    }
}
