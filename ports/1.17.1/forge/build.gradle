plugins { id 'java'; id 'net.minecraftforge.gradle' version '7.0.40'; id 'com.gradleup.shadow' version '9.6.1'; id 'net.minecraftforge.renamer' version '1.1.5' }
minecraft { mappings channel: 'official', version: findProperty('minecraft_version') ?: '1.17.1' }
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies {
    implementation minecraft.dependency("${findProperty('forge_group') ?: 'net.minecraftforge'}:forge:${findProperty('minecraft_version') ?: '1.17.1'}-${findProperty('forge_version') ?: '37.1.1'}")
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}
jar { manifest { attributes 'MixinConfigs': 'flightblock.mixins.json' } }

def sharedRoot = file('../../..')
def sharedProperties = new Properties()
file("${sharedRoot}/gradle.properties").withInputStream { sharedProperties.load(it) }
version = sharedProperties.getProperty('version')
group = 'dev.flightblock'
def mc = findProperty('minecraft_version') ?: '1.17.1'
configurations { shadowExtras }
dependencies { shadowExtras('io.github.llamalad7:mixinextras-common:0.5.5') { transitive = false } }
tasks.named('jar') { archiveClassifier = 'slim' }
tasks.named('shadowJar') {
    configurations = [project.configurations.shadowExtras]
    archiveClassifier = 'dev'
    relocate 'com.llamalad7.mixinextras', 'dev.flightblock.internal.mixinextras'
    mergeServiceFiles()
}
base { archivesName = "flightblock-${mc}-${findProperty('target_loader') ?: 'forge'}" }
if (mc in ['1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1']) {
    // Forge through 1.20.4 uses SRG names in production, including Mixin references.
    renamer.mappings(minecraft.dependency.toSrg)
    renamer.enableMixinRefmaps { config 'flightblock.mixins.json'; jar tasks.named('shadowJar', Jar) }
    renamer.classes(tasks.named('shadowJar', Jar)) {
        archiveClassifier = null
        mappings renamer.mixin.generatedMappings
    }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets.main.java {
    srcDir "${sharedRoot}/src/main/java"
    exclude 'dev/flightblock/platform/FabricEntrypoint.java'
    exclude 'dev/flightblock/PalFlightAccess.java'
}
sourceSets.main.resources {
    srcDir '../../1.21.4/forge/src/main/resources'
    srcDir "${sharedRoot}/src/main/resources"
    exclude 'fabric.mod.json'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', mc
    filesMatching('flightblock.mixins.json') { filter { it.replace('JAVA_25', mc == '1.17.1' ? 'JAVA_16' : mc in ['1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1'] ? 'JAVA_17' : 'JAVA_21') } }
    filesMatching('META-INF/*.toml') { expand version: project.version, minecraft_version_range: "[${mc}]" }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = mc == '1.17.1' ? 16 : mc in ['1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1'] ? 17 : 21 }

ext.flightblockSourceRoot = sharedRoot
ext.flightblockOfficialRuntime = !(mc in ['1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1'])
ext.flightblockMinecraftVersion = mc
apply from: new File(sharedRoot, "gradle/minecraft-1.21.11-source-compat.gradle")
