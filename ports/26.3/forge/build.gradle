plugins { id 'java'; id 'net.minecraftforge.gradle' version '7.0.17' }
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${findProperty('minecraft_version') ?: '26.3'}-${findProperty('forge_version') ?: '66.0.9'}")
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
}
jar { manifest { attributes 'MixinConfigs': 'flightblock.mixins.json' } }

def sharedRoot = file('../../..')
def sharedProperties = new Properties()
file("${sharedRoot}/gradle.properties").withInputStream { sharedProperties.load(it) }
version = sharedProperties.getProperty('version')
group = 'dev.flightblock'
def mc = findProperty('minecraft_version') ?: '26.3'
base { archivesName = "flightblock-${mc}-forge" }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
sourceSets.main.java {
    srcDir "${sharedRoot}/src/main/java"
    exclude 'dev/flightblock/platform/FabricEntrypoint.java'
    exclude 'dev/flightblock/PalFlightAccess.java'
}
sourceSets.main.resources {
    srcDir "${sharedRoot}/src/main/resources"
    exclude 'fabric.mod.json'
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', mc
    filesMatching('META-INF/*.toml') { expand version: project.version, minecraft_version_range: "[${mc}]" }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }

ext.flightblockSourceRoot = sharedRoot
ext.flightblockMinecraftVersion = mc
apply from: new File(sharedRoot, "gradle/minecraft-26-source-compat.gradle")
