plugins { id 'net.fabricmc.fabric-loom-remap' version '1.17.21' }

def sharedRoot = file('../../..')
def sharedProperties = new Properties()
file("${sharedRoot}/gradle.properties").withInputStream { sharedProperties.load(it) }
version = sharedProperties.getProperty('version')
group = 'dev.flightblock'
def targetLoader = findProperty('target_loader') ?: 'fabric'
def mc = findProperty('minecraft_version') ?: '1.21.11'
def api = findProperty('fabric_api_version') ?: '0.141.6+1.21.11'
def pal = findProperty('pal_version') ?: '1.15.0'
def javaRelease = mc == '1.16.5' ? 8 : mc == '1.17.1' ? 16 : mc in ['1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1', '1.16.5'] ? 17 : 21
base { archivesName = "flightblock-${mc}-${targetLoader}" }
repositories {
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.quiltmc.org/repository/release' }
}
dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    mappings loom.officialMojangMappings()
    if (targetLoader == 'quilt') {
        modImplementation 'org.quiltmc:quilt-loader:0.31.0-beta.4'
        // Loom reads Fabric's loader libraries to supply the shared Mixin API during compilation.
        modCompileOnly 'net.fabricmc:fabric-loader:0.19.5'
    }
    else modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${api}"
    if (mc in ['1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1', '1.16.5']) modImplementation fabricApi.module('fabric-object-builder-api-v1', api)
    // The target's explicit API version must not be replaced by PAL's development dependencies.
    modImplementation("io.github.ladysnake:PlayerAbilityLib:${pal}") { transitive = false }
    include "io.github.ladysnake:PlayerAbilityLib:${pal}"
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.5'
}
ext.flightblockSourceRoot = sharedRoot
ext.flightblockMinecraftVersion = mc
apply from: new File(sharedRoot, 'gradle/minecraft-1.21.11-source-compat.gradle')
sourceSets.main.resources.srcDir "${sharedRoot}/src/main/resources"
sourceSets.test.java {
    srcDir layout.buildDirectory.dir('version-tests')
    exclude 'dev/flightblock/RecipeMarkerCheck.java'
}
def prepareTests = tasks.register('prepareVersionTests', Sync) {
    from "${sharedRoot}/src/test/java"
    into layout.buildDirectory.dir('version-tests')
    filteringCharset = 'UTF-8'
    filter { String line ->
        def adapted = line.replace('RecipeMarkerCheck.run()', 'RecipeMarkerCheck21.run()')
        if (mc in ['1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1', '1.16.5']) adapted = adapted.replace('RecipeMarkerCheck21.run()', 'RecipeMarkerCheckLegacy.run()').replace('import net.minecraft.util.ProblemReporter;', '').replace('.getOrThrow()', '.getOrThrow(false, error -> { throw new IllegalArgumentException(error); })')
        if (mc in ['1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1', '1.16.5']) adapted = adapted.replace('PalCompatibilityCheck.run()', 'LegacyJson.main(new String[0]); PalCompatibilityCheck.run()')
        if (mc in ['1.21.4', '1.21.1', '1.20.6', '1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1', '1.16.5']) {
            adapted = adapted.replace('import net.minecraft.world.level.storage.TagValueOutput;', '')
                .replace('var output = TagValueOutput.createWithoutContext(ProblemReporter.DISCARDING)', 'var output = new net.minecraft.nbt.CompoundTag()')
                .replace('output.buildResult().getListOrEmpty("ability_sources")', 'output.getList("ability_sources", 8)')
        }
        if (mc in ['1.17.1', '1.16.5'] && (adapted.contains('var ops = net.minecraft.resources.RegistryOps.create(') || adapted.contains('RegistryAccess.fromRegistryOfRegistries('))) adapted = ''
        if (mc in ['1.17.1', '1.16.5']) adapted = adapted.replace('LegacyRecipes.parse(ops, json)', 'LegacyRecipes.parse(com.mojang.serialization.JsonOps.INSTANCE, json)')
        if (mc in ['1.19.2', '1.18.2', '1.17.1', '1.16.5']) adapted = adapted.replace('BuiltInRegistries', 'Registry').replace('net.minecraft.core.registries.Registry', 'net.minecraft.core.Registry')
        if (mc == '1.16.5') adapted = adapted.replace('SharedConstants.tryDetectVersion()', 'SharedConstants.getCurrentVersion()')
        if (mc in ['1.17.1', '1.16.5']) adapted = adapted.replace('com.google.gson.JsonParser.parseString(', 'new com.google.gson.JsonParser().parse(')
        adapted
    }
}
tasks.named('compileTestJava') { dependsOn prepareTests }
if (mc == '1.20.6') {
    def prepareLocalTests = tasks.register('prepareLegacyRecipeCheck', Sync) {
        from 'src/test/java'
        into layout.buildDirectory.dir('local-version-tests')
        filteringCharset = 'UTF-8'
        filter { it.replace('/data/flightblock/recipe/', '/data/flightblock/recipes/') }
    }
    sourceSets.test.java.setSrcDirs([layout.buildDirectory.dir('version-tests'), layout.buildDirectory.dir('local-version-tests')])
    tasks.named('compileTestJava') { dependsOn prepareLocalTests }
}
if (mc in ['1.20.4', '1.20.2', '1.20.1', '1.19.4', '1.19.2', '1.18.2', '1.17.1', '1.16.5']) {
    prepareTests.configure {
        from new File(sharedRoot, 'ports/legacy/nbt/src/test/java')
        filter { it.replace('Recipe.CODEC.parse(', mc == '1.20.4' ? 'Recipe.CODEC.parse(' : 'LegacyRecipes.parse(') }
    }
    sourceSets.test.java.setSrcDirs([layout.buildDirectory.dir('version-tests')])
}
loom {
    mixin { useLegacyMixinAp = true; defaultRefmapName = 'flightblock.refmap.json' }
}
processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', mc
    inputs.property 'fabric_api_version', api
    inputs.property 'pal_version', pal
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: mc,
            fabric_api_version: api, loader_version: '0.19.5'
        filter { it.replace('>=25', ">=${javaRelease}").replace('>=1.16.0', ">=${pal}") }
    }
    filesMatching('flightblock.mixins.json') {
        filter { it.replace('JAVA_25', "JAVA_${javaRelease}").replace('"required": true,', '"required": true, "refmap": "flightblock.refmap.json",') }
    }
}
tasks.withType(JavaCompile).configureEach { options.release = name == 'compileTestJava' ? Math.max(17, javaRelease) : javaRelease; options.encoding = 'UTF-8'; options.compilerArgs.add '-Werror' }
java { withSourcesJar() }
tasks.register('verifyRules', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.flightblock.RulesCheck'
    enableAssertions = true
    doFirst {
        classpath.files.findAll { it.name.contains('object-builder') }.each { file ->
            def archive = new java.util.zip.ZipFile(file)
            try {
                logger.lifecycle("Recipe check object-builder dependency: ${file.name}; builder=${archive.getEntry('net/fabricmc/fabric/api/object/builder/v1/block/entity/FabricBlockEntityType$Builder.class') != null}")
            } finally { archive.close() }
        }
    }
}
check.dependsOn verifyRules
test { enabled = false; dependsOn verifyRules }
