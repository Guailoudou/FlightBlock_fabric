plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def targetLoader = findProperty('target_loader') ?: 'fabric'
if (!(targetLoader in ['fabric', 'quilt'])) throw new GradleException("Unsupported loader: ${targetLoader}")
base { archivesName = "flightblock-${minecraft_version}-${targetLoader}" }

// 26.1 uses the same gameplay APIs, with three names/signatures changed later.
// Generate a compile-time variant instead of probing Minecraft classes at runtime.
if (minecraft_version in ['26.1', '26.1.1', '26.1.2']) {
    def versionSources = layout.buildDirectory.dir('version-sources')
    def prepareSources = tasks.register('prepareVersionSources', Sync) {
        from 'src/main/java'
        into versionSources
        filteringCharset = 'UTF-8'
        filter { String line ->
            line.replace('EntityTypes.BLOCK_DISPLAY', 'EntityType.BLOCK_DISPLAY')
                .replace('Recipe.DIRECT_CODEC', 'Recipe.CODEC')
                .replace('p.drop(stack, false, net.minecraft.util.Prediction.PREDICTED)', 'p.drop(stack, false)')
        }
    }
    sourceSets.main.java.setSrcDirs([versionSources])
    tasks.named('compileJava') { dependsOn prepareSources }
    tasks.named('sourcesJar') { dependsOn prepareSources }
}

repositories {
    maven { url = 'https://maven.ladysnake.org/releases' }
    maven { url = 'https://maven.quiltmc.org/repository/release' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (targetLoader == 'quilt') implementation 'org.quiltmc:quilt-loader:0.31.0-beta.4'
    else implementation "net.fabricmc:fabric-loader:${loader_version}"
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.5'
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "io.github.ladysnake:PlayerAbilityLib:${pal_version}"
    include "io.github.ladysnake:PlayerAbilityLib:${pal_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'fabric_api_version', fabric_api_version
    inputs.property 'loader_version', loader_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: minecraft_version,
            fabric_api_version: fabric_api_version, loader_version: loader_version
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.register('verifyRules', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.flightblock.RulesCheck'
    enableAssertions = true
}
check.dependsOn verifyRules
// Tests use an assertion-based Java entrypoint instead of a separate test engine.
test {
    enabled = false
    dependsOn verifyRules
}
loom {
    runs {
        server {
            if (project.hasProperty('flightblockVerify')) vmArg '-Dflightblock.verify=true'
        }
    }
}
