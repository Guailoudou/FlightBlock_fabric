plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.register('verifyRules', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.flightblock.RulesCheck'
    enableAssertions = true
}
check.dependsOn verifyRules
// Tests use an assertion-based Java entrypoint instead of a separate test engine.
test {
    enabled = false
    dependsOn verifyRules
}
loom {
    runs {
        server {
            if (project.hasProperty('flightblockVerify')) vmArg '-Dflightblock.verify=true'
        }
    }
}
